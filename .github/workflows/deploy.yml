name: S.T.A.R.K. CI/CD Pipeline - Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  REGION: asia-south1
  REPOSITORY: stark-repo
  SERVICE: stark-app

jobs:
  # Job 1: Runs on all branches (dev & main) to validate code syntax & dependencies
  validate:
    name: 🧪 Validate Code & Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python Syntax
        run: |
          python -m py_compile app.py src/ollama_manager.py src/stark_kernel.py
          echo "✅ All Python files compiled successfully without syntax errors."

      - name: Check Dependencies & Dockerfile
        run: |
          test -f requirements.txt && echo "✅ requirements.txt present."
          test -f Dockerfile && echo "✅ Dockerfile present."
          test -f .dockerignore && echo "✅ .dockerignore present."

  # Job 2: Deploys ONLY on pushes to main (or manual 1-click trigger)
  deploy:
    name: 🚀 Build & Deploy to Cloud Run (Mumbai)
    needs: validate
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Codebase
        uses: actions/checkout@v4

      - name: 2. Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 3. Set Up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 4. Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: 5. Build and Tag Container
        run: |
          CLEAN_PROJECT_ID=$(echo -n "${{ secrets.GCP_PROJECT_ID }}" | tr -d '[:space:]')
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${CLEAN_PROJECT_ID}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          LATEST_URI="${{ env.REGION }}-docker.pkg.dev/${CLEAN_PROJECT_ID}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:latest"
          
          echo "Building image: $IMAGE_URI"
          docker build -t "$IMAGE_URI" -t "$LATEST_URI" .
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

      - name: 6. Deploy to Google Cloud Run (Mumbai)
        run: |
          CLEAN_PROJECT_ID=$(echo -n "${{ secrets.GCP_PROJECT_ID }}" | tr -d '[:space:]')
          CLEAN_API_KEY=$(echo -n "${{ secrets.GROQ_API_KEY || secrets.GEMINI_API_KEY }}" | tr -d '[:space:]')
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${CLEAN_PROJECT_ID}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          
          TARGET_MODEL="${{ secrets.MODEL || 'qwen/qwen3.8-27b' }}"
          TARGET_BASE_URL="${{ secrets.BASE_URL || 'https://api.groq.com/openai/v1' }}"
          
          gcloud run deploy ${{ env.SERVICE }} \
            --project "$CLEAN_PROJECT_ID" \
            --image "$IMAGE_URI" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --set-env-vars "BASE_URL=${TARGET_BASE_URL},API_KEY=${CLEAN_API_KEY},MODEL=${TARGET_MODEL},APP_PASSWORD=${{ secrets.APP_PASSWORD }}"

      - name: 7. Output Live Service URL
        run: |
          CLEAN_PROJECT_ID=$(echo -n "${{ secrets.GCP_PROJECT_ID }}" | tr -d '[:space:]')
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE }} --project "$CLEAN_PROJECT_ID" --region ${{ env.REGION }} --format 'value(status.url)')
          echo "=========================================================="
          echo "🚀 S.T.A.R.K. IS LIVE IN MUMBAI (asia-south1):"
          echo "$SERVICE_URL"
          echo "=========================================================="
